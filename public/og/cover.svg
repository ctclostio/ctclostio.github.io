  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="985" cy="112" r="220" fill="#7170ff" opacity="0.18"/>
  <circle cx="154" cy="548" r="260" fill="#10b981" opacity="0.12"/>
  <rect x="72" y="74" width="1056" height="482" rx="34" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.13)"/>
