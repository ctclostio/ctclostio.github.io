  <desc id="desc">Social preview for a portfolio of AI tools, games, simulations, and developer utilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090a"/>
